{{define "main-card"}}
<div class="sl-body"><div class="sl-intro">
<h1 class="sl-name sl-pending">{{.Name}}</h1>
<div class="sl-head"><span class="sl-dot" data-color="{{.Color}}" aria-hidden="true"></span><p class="sl-status sl-pending">{{.Status.Name}}</p></div>
<p class="sl-desc sl-pending">{{.Status.Desc}}</p>
</div></div>
<footer class="sl-foot"><div class="sl-foot-row"><span class="sl-clock"></span><span class="sl-foot-r"><span class="sl-conn" data-state="connecting">{{.T.connecting}}</span></span></div></footer>
{{end}}

{{define "head-common"}}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141920" media="(prefers-color-scheme: dark)">
    <script>(function(){try{var m=localStorage.getItem('sl-theme');if(m==='light'||m==='dark')document.documentElement.dataset.theme=m}catch(e){}})()</script>
    <link rel="icon" href="{{.Favicon}}">
    <link rel="preload" href="{{.Assets}}/static/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{.Assets}}/static/paper.css">
{{end}}

{{define "theme-btn"}}<button type="button" class="sl-theme" id="sl-theme"><svg class="sl-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sl-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>{{end}}
