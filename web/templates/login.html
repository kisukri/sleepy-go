<!DOCTYPE html>
<html lang="{{.Lang}}" class="sl-html">

<head>
    {{template "head-common" .}}
    <title>{{.Name}} · {{.T.login_btn}}</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="{{.Assets}}/static/admin.css">
</head>

<body class="pn-body" data-use-modern-auth="true">
    <main class="sl-page pn-login">
        <p class="pn-who">{{.Name}}</p>
        <h1 class="pn-title">{{.T.login_title}}</h1>
        <div id="loading-message"><p class="pn-mute">{{.T.login_check}}</p></div>
        <form class="login-form" style="display: none" onsubmit="return false">
            <label for="secret" class="pn-label">{{.T.login_secret}}</label>
            <input type="password" id="secret" class="pn-input" autocomplete="current-password" placeholder="{{.T.login_ph}}" autofocus>
            <p id="error-message" class="pn-error" role="alert"></p>
            <button type="button" class="pn-btn pn-btn-dark login-btn">{{.T.login_btn}}</button>
        </form>
        <a href="/" class="pn-back">{{.T.login_back}}</a>
    </main>
    <script id="sl-words" type="application/json">{{.Words}}</script>
    <script src="{{.Assets}}/static/login.js"></script>
</body>

</html>
