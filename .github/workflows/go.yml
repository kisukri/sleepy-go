name: Go
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/sleepy-go ./cmd/sleepy-go
      - run: CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -o /tmp/sleepy-go-arm64 ./cmd/sleepy-go
      - run: GOOS=windows go vet ./cmd/sleepy-client
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  windows-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build sleepy-client.exe (no console window)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/sleepy-client.exe ./cmd/sleepy-client
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/sleepy-client-arm64.exe ./cmd/sleepy-client
      - uses: actions/upload-artifact@v4
        with:
          name: sleepy-client-windows
          path: dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
