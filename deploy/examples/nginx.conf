# Optional. Put this in /etc/nginx/conf.d/ and get a certificate
# (for example with certbot: certbot --nginx -d status.example.com).
# Install Sleepy with: LISTEN=127.0.0.1 ALLOWED_HOSTS=status.example.com

server {
    listen 80;
    server_name status.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;  # older nginx: use "listen 443 ssl http2;" instead
    server_name status.example.com;

    ssl_certificate     /etc/letsencrypt/live/status.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9010;
        proxy_set_header Host $host;                 # needed for admin writes
        proxy_set_header X-Forwarded-Proto $scheme;  # needed for admin writes
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # live updates (SSE)
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
